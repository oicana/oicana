[package]
name = "oicana_export"
description = "Helpers to export a compiled document."
keywords = { workspace = true }
categories = { workspace = true }
version = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license-file = { workspace = true }
readme = { workspace = true }

[features]
default = ["pdf", "svg", "png"]
png = ["dep:typst-render", "dep:png", "dep:thiserror"]
pdf = ["dep:typst-pdf", "dep:thiserror"]
svg = ["dep:typst-svg", "dep:thiserror"]

[dependencies]
oicana_world = { workspace = true }
oicana_template = { workspace = true }

typst-render = { workspace = true, optional = true }
typst-pdf = { workspace = true, optional = true }
typst-svg = { workspace = true, optional = true }
typst = { workspace = true }
typst-layout = { workspace = true }

serde = { workspace = true, features = ["derive"] }

png = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
oicana_files = { workspace = true, features = ["preloaded"] }
oicana_input = { workspace = true }
