[package]
name = "oicana_cli"
description = "Scaffold, validate, snapshot-test, and pack Oicana templates."
keywords = { workspace = true }
categories = { workspace = true }
version = "0.9.0-rc.2"
rust-version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
# Explicitly link to copy of License file, because dist fails to copy from the root
license-file = "LICENSE.md"
readme = { workspace = true }


[[bin]]
name = "oicana"
path = "src/main.rs"
doc = false

[dependencies]
oicana_testing = { workspace = true }
oicana = { workspace = true, features = ["native", "pdf", "png", "svg"] }

typst = { workspace = true }
typst-layout = { workspace = true }

log = { workspace = true }
env_logger = { workspace = true }

clap-verbosity = { workspace = true }
clap = { workspace = true, features = ["derive"] }
rayon = { workspace = true }

chrono = { workspace = true }
walkdir = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
color-print = { workspace = true }
indicatif = { workspace = true }
console = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
jsonschema = { workspace = true }
rand = { workspace = true }
notify = { workspace = true }
same-file = { workspace = true }

axoupdater = { version = "0.10", default-features = false, features = ["github_releases", "blocking"], optional = true }

# Explicitly depend on OpenSSL if applicable, so that we can add the
# `openssl/vendored` feature to it if `vendor-openssl` is enabled.
[target.'cfg(not(any(target_os = "windows", target_os = "macos", target_os = "ios", target_os = "watchos", target_os = "tvos")))'.dependencies]
openssl = { workspace = true, optional = true }

[features]
# Whether to vendor OpenSSL. Not applicable to Windows and macOS builds.
vendor-openssl = ["openssl?/vendored"]
# Enables the `oicana update` subcommand, which updates the binary in place
# when it was installed via the official shell/powershell installer.
self-update = ["dep:axoupdater"]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[package.metadata.dist]
dist = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/oicana_cli-v{ version }/oicana_cli-{ target }{ archive-suffix }"
bin-dir = "oicana_cli-{ target }/oicana{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides]
x86_64-pc-windows-msvc = { pkg-fmt = "zip", bin-dir = "oicana{ binary-ext }" }
aarch64-pc-windows-msvc = { pkg-fmt = "zip", bin-dir = "oicana{ binary-ext }" }

[package.metadata.wix]
upgrade-guid = "CD91DE14-3590-4CE1-A8A1-0B385690480D"
path-guid = "3690C951-9006-44C7-8B81-5056143147B5"
license = false
eula = false
