name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-crates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: check format
        run: cargo fmt --all -- --check
      - name: run clippy
        run: cargo clippy --all-targets --all-features -- -Dwarnings

  audit-crates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: audit dependencies
        # ignore list for advisories we cannot act on lives in .cargo/audit.toml
        run: cargo audit

  check-crates:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
      - uses: dtolnay/rust-toolchain@stable
      - name: check
        run: cargo check --all-features --all-targets

  test-crates:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
      - uses: dtolnay/rust-toolchain@stable
      - name: run tests
        run: cargo test --all-targets --all-features

  check-node-native-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: integrations/node/oicana-node-native/yarn.lock
      - name: Install dependencies
        run: yarn install
        working-directory: integrations/node/oicana-node-native
      - name: Oxlint
        run: yarn lint
        working-directory: integrations/node/oicana-node-native
      - name: Format check
        run: yarn format:check
        working-directory: integrations/node/oicana-node-native

  check-node-wrapper:
    runs-on: ubuntu-latest
    needs:
      - build-node-native
    steps:
      - uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download node-native
        uses: actions/download-artifact@v8
        with:
          name: node_native_Linux
          path: ./integrations/node/oicana-node-native
      - name: Link node-native
        run: npm link
        working-directory: ./integrations/node/oicana-node-native
      - name: Install dependencies
        run: |
          npm pkg delete dependencies['@oicana/node-native']
          npm install
          npm link @oicana/node-native
        working-directory: integrations/node/oicana-node
      - name: Lint
        run: npm run lint
        working-directory: integrations/node/oicana-node
      - name: Build
        run: npm run build
        working-directory: integrations/node/oicana-node

  check-browser-wrapper:
    runs-on: ubuntu-latest
    needs:
      - build-browser-wasm
    steps:
      - uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download browser-wasm
        uses: actions/download-artifact@v8
        with:
          name: browser-wasm
          path: ./integrations/browser/oicana_browser_wasm/pkg
      - name: Link browser-wasm
        run: npm link
        working-directory: ./integrations/browser/oicana_browser_wasm/pkg
      - name: Install dependencies
        run: |
          npm pkg delete dependencies['@oicana/browser-wasm']
          npm install
          npm link @oicana/browser-wasm
        working-directory: integrations/browser/oicana-browser
      - name: Lint
        run: npm run lint
        working-directory: integrations/browser/oicana-browser
      - name: Build
        run: npm run build
        working-directory: integrations/browser/oicana-browser

  check-csharp-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: check format
        run: dotnet format --verify-no-changes
        working-directory: ./integrations/csharp
      - name: create bindings
        run: cargo run --example csharp_bindings -p oicana_csharp
      - name: format bindings
        run: dotnet format
        working-directory: ./integrations/csharp
      - name: validate no changes
        run: |
          if [ -n "$(git status --porcelain './integrations/csharp/')" ]; then
            echo "::error::Generated C# bindings are out of date! Update them and check in any changes."
            git --no-pager diff --color=always './integrations/csharp/'
            exit 1
          fi

  check-python-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
      - uses: dtolnay/rust-toolchain@stable
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Sync workspace dependencies
        run: uv sync
        working-directory: integrations/python
      - name: Lint with ruff
        run: uv run ruff check src/
        working-directory: integrations/python/oicana-python
      - name: Type check with mypy
        run: uv run mypy src/oicana
        working-directory: integrations/python/oicana-python

  check-php-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction
        working-directory: integrations/php/oicana-php
      - name: Static analysis with PHPStan
        run: composer phpstan
        working-directory: integrations/php/oicana-php
      - name: Check code style
        run: composer cs-check
        working-directory: integrations/php/oicana-php
      - name: Check Rust formatting
        run: cargo fmt --check
        working-directory: integrations/php/oicana-php-native
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -Dwarnings
        working-directory: integrations/php/oicana-php-native
      - name: Check
        run: cargo check --all-features --all-targets
        working-directory: integrations/php/oicana-php-native
      - name: Test
        run: cargo test
        working-directory: integrations/php/oicana-php-native

  build-csharp:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            lib: liboicana_csharp.so
          - os: macos-latest
            lib: liboicana_csharp.dylib
          - os: windows-latest
            lib: oicana_csharp.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
      - uses: dtolnay/rust-toolchain@stable
      - name: build oicana_csharp
        run: cargo build --release -p oicana_csharp
      - name: Upload liboicana_csharp
        uses: actions/upload-artifact@v7
        with:
          name: liboicana_csharp_${{ runner.os }}
          path: ./target/release/${{ matrix.lib }}
          if-no-files-found: error

  build-browser-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: build browser wasm
        run: wasm-pack build --release --target web --scope oicana integrations/browser/oicana_browser_wasm
      - name: rename package
        run: jq '.name = "@oicana/browser-wasm"' package.json > tmp.json && mv tmp.json package.json
        working-directory: ./integrations/browser/oicana_browser_wasm/pkg
      - name: Upload browser-wasm
        uses: actions/upload-artifact@v7
        with:
          name: browser-wasm
          path: |
            ./integrations/browser/oicana_browser_wasm/pkg/oicana_browser_wasm**
            ./integrations/browser/oicana_browser_wasm/pkg/package.json
            ./integrations/browser/oicana_browser_wasm/pkg/README.md
          if-no-files-found: error

  build-node-native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: integrations/node/oicana-node-native/yarn.lock
      - uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: yarn install
        working-directory: integrations/node/oicana-node-native
      - name: Build
        run: yarn build
        working-directory: integrations/node/oicana-node-native
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: node_native_${{ runner.os }}
          path: |
            integrations/node/oicana-node-native/node-native.*.node
          if-no-files-found: error
      - name: Format
        run: yarn format
        working-directory: integrations/node/oicana-node-native
      - name: Normalize line endings
        shell: bash
        run: git add --renormalize ./integrations/node/oicana-node-native/
      - name: validate no changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain './integrations/node/oicana-node-native/')" ]; then
            echo "::error::Generated JS bindings are out of date! Update them and check in any changes."
            git --no-pager diff --color=always './integrations/node/oicana-node-native/'
            exit 1
          fi

  build-tools:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        tool_config:
          - tool: "oicana-cli"
            path: "tools/oicana_cli"
            bin: "oicana"
          - tool: "test-compare"
            path: "tools/test_compare"
            bin: "test-compare"
        include:
          - os: windows-latest
            bin_ext: ".exe"
          - os: ubuntu-latest
            bin_ext: ""
          - os: macos-latest
            bin_ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and install ${{ matrix.tool_config.tool }}
        run: cargo install --force --path ${{ matrix.tool_config.path }}
      - name: Upload CLI tool binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.tool_config.tool }}_${{ runner.os }}
          path: ~/.cargo/bin/${{ matrix.tool_config.bin }}${{ matrix.bin_ext }}
          if-no-files-found: error

  build-python-native:
    name: Build oicana-native (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: auto, artifact: python_native_ubuntu-latest }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2, artifact: python_native_musl }
          - { os: macos-latest, target: aarch64-apple-darwin, manylinux: auto, artifact: python_native_macos-latest }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, manylinux: auto, artifact: python_native_windows-latest }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          command: build
          args: --release --out dist --find-interpreter
          working-directory: integrations/python/oicana-python-native
          manylinux: ${{ matrix.platform.manylinux }}
          sccache: 'true'
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform.artifact }}
          path: integrations/python/oicana-python-native/dist/*.whl
          if-no-files-found: error

  build-php-native:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust: stable
            lib: liboicana_php_native.so
            flags: "-C link-arg=-Wl,-undefined,dynamic_lookup"
          - os: macos-latest
            target: aarch64-apple-darwin
            rust: stable
            lib: liboicana_php_native.dylib
            flags: "-C link-arg=-Wl,-undefined,dynamic_lookup"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            # ext-php-rs requires nightly Rust when on Windows.
            rust: nightly
            lib: oicana_php_native.dll
            flags: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt
      - run: rustup show
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
        env:
          debug: true
      - run: php -v
      - name: Pin MSVC toolset to the PHP core's linker version
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/pin-msvc-for-php.ps1
      - name: Build PHP extension
        run: cargo build --release --target ${{ matrix.target }} -p oicana_php_native
        env:
          RUSTFLAGS: ${{ matrix.flags }}
      - name: Verify PHP extension loads
        run: |
          php -d extension=./target/${{ matrix.target }}/release/${{ matrix.lib }} -r "print_r(array_filter(get_defined_functions()['internal'], fn(\$f) => str_contains(\$f, 'oicana') || str_contains(\$f, 'register') || str_contains(\$f, 'compile')));"
          php -d extension=./target/${{ matrix.target }}/release/${{ matrix.lib }} -r "exit(function_exists('OicanaInternal\\manifest') ? 0 : 1);"
        shell: bash
      - name: Upload PHP extension
        uses: actions/upload-artifact@v7
        with:
          name: php_native_${{ runner.os }}
          path: ./target/${{ matrix.target }}/release/${{ matrix.lib }}
          if-no-files-found: error

  e2e-test-node-integration:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs:
      - build-tools
      - build-node-native
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: typship
      - name: Install local Typst Oicana package
        run: typship install local
        working-directory: ./integrations/typst
      - uses: ./.github/actions/install-tool
        with:
          tool: "oicana-cli"
          bin: "oicana"
      - uses: ./.github/actions/install-tool
        with:
          tool: "test-compare"
      - name: test e2e template
        run: oicana test
        working-directory: ./e2e-tests/template
      - name: pack e2e template
        run: oicana pack -n '{template}-x.y.z.zip'
        working-directory: ./e2e-tests/template
      - name: install node-native
        uses: actions/download-artifact@v8
        with:
          name: node_native_${{ runner.os }}
          path: ./integrations/node/oicana-node-native
      - name: test node-native bindings
        run: yarn install && yarn test
        working-directory: ./integrations/node/oicana-node-native
      - name: Enable npm link in node-native
        run: npm link
        working-directory: ./integrations/node/oicana-node-native
      - name: install node integration
        run: |
          npm pkg delete dependencies['@oicana/node-native']
          npm install
          npm link @oicana/node-native
        working-directory: ./integrations/node/oicana-node
      - name: test node integration
        run: npm run test
        working-directory: ./integrations/node/oicana-node
      - name: compare test output
        run: test-compare e2e-tests/template integrations/node/oicana-node/testOutput/

  e2e-test-browser-integration:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs:
      - build-tools
      - build-browser-wasm
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: typship
      - name: Install local Typst Oicana package
        run: typship install local
        working-directory: ./integrations/typst
      - uses: ./.github/actions/install-tool
        with:
          tool: "oicana-cli"
          bin: "oicana"
      - uses: ./.github/actions/install-tool
        with:
          tool: "test-compare"
      - name: test e2e template
        run: oicana test
        working-directory: ./e2e-tests/template
      - name: pack e2e template
        run: oicana pack -n '{template}-x.y.z.zip'
        working-directory: ./e2e-tests/template
      - name: install browser-wasm
        uses: actions/download-artifact@v8
        with:
          name: browser-wasm
          path: ./integrations/browser/oicana_browser_wasm/pkg
      - name: Enable npm link in browser-wasm
        run: npm link
        working-directory: ./integrations/browser/oicana_browser_wasm/pkg
      - name: install browser integration
        run: |
          npm pkg delete dependencies['@oicana/browser-wasm']
          npm install
          npm link @oicana/browser-wasm
        working-directory: ./integrations/browser/oicana-browser
      - name: test browser integration
        run: npm run test
        working-directory: ./integrations/browser/oicana-browser
      - name: compare test output
        run: test-compare e2e-tests/template integrations/browser/oicana-browser/testOutput/

  e2e-test-csharp-integration:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs:
      - build-tools
      - build-csharp
    steps:
      - uses: actions/checkout@v6
      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: taiki-e/install-action@v2
        with:
          tool: typship
      - name: Install local Typst Oicana package
        run: typship install local
        working-directory: ./integrations/typst
      - uses: ./.github/actions/install-tool
        with:
          tool: "oicana-cli"
          bin: "oicana"
      - uses: ./.github/actions/install-tool
        with:
          tool: "test-compare"
      - name: test e2e template
        run: oicana test
        working-directory: ./e2e-tests/template
      - name: pack e2e template
        run: oicana pack -n '{template}-x.y.z.zip'
        working-directory: ./e2e-tests/template
      - name: install csharp lib
        uses: actions/download-artifact@v8
        with:
          name: liboicana_csharp_${{ runner.os }}
          path: ./target/release/
      - name: test csharp integration
        run: dotnet test
        working-directory: ./integrations/csharp
      - name: compare test output
        run: test-compare e2e-tests/template integrations/csharp/Oicana.Test/bin/Debug/net8.0/e2e/

  e2e-test-python-integration:
    name: Python E2E (${{ matrix.libc }} / ${{ matrix.os }}${{ matrix.python-version && format(' / py{0}', matrix.python-version) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: '3.9', libc: gnu }
          - { os: ubuntu-latest, python-version: '3.14', libc: gnu }
          - { os: macos-latest, python-version: '3.9', libc: gnu }
          - { os: macos-latest, python-version: '3.14', libc: gnu }
          - { os: windows-latest, python-version: '3.9', libc: gnu }
          - { os: windows-latest, python-version: '3.14', libc: gnu }
          - { os: ubuntu-latest, libc: musl }
    runs-on: ${{ matrix.os }}
    needs:
      - build-tools
      - build-python-native
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        if: matrix.libc == 'gnu'
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: typship
      - name: Install local Typst Oicana package
        run: typship install local
        working-directory: ./integrations/typst
      - uses: ./.github/actions/install-tool
        with:
          tool: "oicana-cli"
          bin: "oicana"
      - uses: ./.github/actions/install-tool
        with:
          tool: "test-compare"
      - name: test e2e template
        run: oicana test
        working-directory: ./e2e-tests/template
      - name: pack e2e template
        run: oicana pack -n '{template}-x.y.z.zip'
        working-directory: ./e2e-tests/template
      - name: Download wheel
        if: matrix.libc == 'gnu'
        uses: actions/download-artifact@v8
        with:
          name: python_native_${{ matrix.os }}
          path: ./dist
      - name: Install uv
        if: matrix.libc == 'gnu'
        uses: astral-sh/setup-uv@v7
      - name: Install native wheel
        if: matrix.libc == 'gnu'
        shell: bash
        run: uv pip install --system dist/*.whl
      - name: Install wrapper package
        if: matrix.libc == 'gnu'
        run: |
          uv pip install --system --no-deps .
          uv pip install --system pytest
        working-directory: ./integrations/python/oicana-python
      - name: Run Python tests
        if: matrix.libc == 'gnu'
        run: pytest tests -v
        working-directory: ./integrations/python/oicana-python
      - name: Download musllinux wheel
        if: matrix.libc == 'musl'
        uses: actions/download-artifact@v8
        with:
          name: python_native_musl
          path: ./dist-musl
      - name: Run Python tests in Alpine (musl)
        if: matrix.libc == 'musl'
        run: |
          docker run --rm -v "$PWD:/io" -w /io alpine:3.20 sh -ec '
            apk add --no-cache python3 py3-pip
            python3 -m venv /venv
            . /venv/bin/activate
            pip install --quiet /io/dist-musl/*.whl
            pip install --quiet --no-deps /io/integrations/python/oicana-python
            pip install --quiet pytest
            cd /io/integrations/python/oicana-python
            pytest tests -v
          '
      - name: compare test output
        run: test-compare e2e-tests/template integrations/python/oicana-python/tests/testOutput/

  e2e-test-php-integration:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            lib: liboicana_php_native.so
          - os: macos-latest
            lib: liboicana_php_native.dylib
          - os: windows-latest
            lib: oicana_php_native.dll
    runs-on: ${{ matrix.os }}
    needs:
      - build-tools
      - build-php-native
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: typship
      - name: Install local Typst Oicana package
        run: typship install local
        working-directory: ./integrations/typst
      - uses: ./.github/actions/install-tool
        with:
          tool: "oicana-cli"
          bin: "oicana"
      - uses: ./.github/actions/install-tool
        with:
          tool: "test-compare"
      - name: test e2e template
        run: oicana test
        working-directory: ./e2e-tests/template
      - name: pack e2e template
        run: oicana pack -n '{template}-x.y.z.zip'
        working-directory: ./e2e-tests/template
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip
          tools: composer
        env:
          debug: true
      - name: Download PHP extension
        uses: actions/download-artifact@v8
        with:
          name: php_native_${{ runner.os }}
          path: ./php-ext
      - name: Install PHP wrapper dependencies
        run: composer install --no-interaction
        working-directory: ./integrations/php/oicana-php
      - name: Verify PHP extension loads
        shell: bash
        run: |
          echo "=== Extension file info ==="
          ls -la php-ext/
          file php-ext/${{ matrix.lib }}
          echo "=== Shared library dependencies ==="
          ldd php-ext/${{ matrix.lib }} || true
          echo "=== PHP version ==="
          php -v
          echo "=== Try loading extension (with errors displayed) ==="
          php -d display_startup_errors=1 -d error_reporting=E_ALL -d extension=php-ext/${{ matrix.lib }} -r "var_dump(extension_loaded('oicana'));" 2>&1
          echo "=== List loaded modules ==="
          php -d extension=php-ext/${{ matrix.lib }} -m 2>&1
          echo "=== Fail if the extension did not load ==="
          php -d extension=php-ext/${{ matrix.lib }} -r "exit(function_exists('OicanaInternal\\manifest') ? 0 : 1);"
      - name: Run PHP tests
        if: success() || failure()
        run: php -d extension=${{ github.workspace }}/php-ext/${{ matrix.lib }} vendor/bin/pest
        working-directory: ./integrations/php/oicana-php
      - name: compare test output
        if: success() || failure()
        run: test-compare e2e-tests/template integrations/php/oicana-php/tests/testOutput/

  build-java-native:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib: liboicana_java_native.so
          - os: macos-latest
            target: aarch64-apple-darwin
            lib: liboicana_java_native.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            lib: oicana_java_native.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache/restore@v5
        with:
          key: ${{ runner.os }}-stable--${{ hashFiles('**/Cargo.toml', 'integrations/java/**/*.rs') }}-
          restore-keys: |
            ${{ runner.os }}-stable--${{ hashFiles('**/Cargo.toml', 'integrations/java/**/*.rs') }}-
            ${{ runner.os }}-stable--
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --all-features -p oicana_java_native -- -Dwarnings
      - name: Build Java JNI library
        run: cargo build --release --target ${{ matrix.target }} -p oicana_java_native
      - name: Upload Java native library
        uses: actions/upload-artifact@v7
        with:
          name: java_native_${{ runner.os }}
          path: ./target/${{ matrix.target }}/release/${{ matrix.lib }}
          if-no-files-found: error

  e2e-test-java-integration:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            natives_dir: linux-x86_64
          - os: macos-latest
            natives_dir: macos-aarch64
          - os: windows-latest
            natives_dir: windows-x86_64
    runs-on: ${{ matrix.os }}
    needs:
      - build-tools
      - build-java-native
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: typship
      - name: Install local Typst Oicana package
        run: typship install local
        working-directory: ./integrations/typst
      - uses: ./.github/actions/install-tool
        with:
          tool: "oicana-cli"
          bin: "oicana"
      - uses: ./.github/actions/install-tool
        with:
          tool: "test-compare"
      - name: test e2e template
        run: oicana test
        working-directory: ./e2e-tests/template
      - name: pack e2e template
        run: oicana pack -n '{template}-x.y.z.zip'
        working-directory: ./e2e-tests/template
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download Java native library
        uses: actions/download-artifact@v8
        with:
          name: java_native_${{ runner.os }}
          path: integrations/java/natives/${{ matrix.natives_dir }}/src/main/resources/natives/${{ matrix.natives_dir }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Run Java E2E tests
        working-directory: integrations/java
        run: ./gradlew :oicana:test
      - name: compare test output
        run: test-compare e2e-tests/template integrations/java/oicana/testOutput/

  e2e-test-cli:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs:
      - build-tools
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-tool
        with:
          tool: "oicana-cli"
          bin: "oicana"
      - uses: ./.github/actions/install-tool
        with:
          tool: "test-compare"
      - uses: taiki-e/install-action@v2
        with:
          tool: typship
      - name: Install local Typst Oicana package
        run: typship install local
        working-directory: ./integrations/typst
      - name: test e2e template
        run: oicana test
        working-directory: ./e2e-tests/template
      - name: compile e2e template with cli
        run: |
          oicana compile -o output -f png -n development.png --development
          oicana compile -o output -f png -n production.png -b development-blob=tests/input.txt -m development-blob=tests/cli/development-blob-meta.json -j development-json=tests/input.json
          oicana compile -o output -f png -n all-inputs.png -b development-blob=tests/input.txt -m development-blob=tests/cli/development-blob-meta.json -j development-json=tests/input.json -b default-blob=tests/input.txt -m default-blob=tests/cli/default-blob-meta.json -j default-json=tests/input.json -b both-blob=tests/input.txt -m both-blob=tests/cli/both-blob-meta.json -j both-json=tests/input.json
        working-directory: e2e-tests/template
      - name: compare test output
        run: test-compare e2e-tests/template e2e-tests/template/output

  typst-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: typst-community/setup-tytanic@v1
        with:
          tytanic-version: 0.3.0
      - uses: taiki-e/install-action@v2
        with:
          tool: typstyle
      - name: check style
        run: typstyle --check .
        working-directory: ./integrations/typst
      - name: Run test suite
        run: tt run
        working-directory: ./integrations/typst
      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: typst-package-test-results
          path: |
            integrations/typst/tests/**/diff/*.png
            integrations/typst/tests/**/out/*.png
            integrations/typst/tests/**/ref/*.png
          retention-days: 5

  spelling:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Actions Repository
      uses: actions/checkout@v6
    - name: Spell Check Repo
      uses: crate-ci/typos@v1.35.5

  validate-links:
    name: Check for dead links in docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # - uses: typst-community/setup-shiroa@v1
      #   with:
      #     shiroa-version: 0.3.1-rc4
      # - name: serve docs
      #   run: |
      #     nohup shiroa serve book --mode static-html --workspace . > /tmp/shiroa.log 2>&1 &
      #     echo $! > /tmp/shiroa.pid
      #     sleep 15
      #   working-directory: docs
      # - name: check for broken links
      #   run: npx linkinator http://localhost:25520 --recurse --config .github/linkinator.config.json
      # - name: clean up
      #   if: always()
      #   run: |
      #     kill $(cat /tmp/shiroa.pid) || true
      #     echo "::: Shiroa Logs :::"
      #     cat /tmp/shiroa.log || true
      - name: check readme links
        if: always()
        run: npx linkinator README.md integrations/typst/README.md integrations/csharp/Oicana/Readme.md integrations/browser/oicana-browser/README.md --config .github/linkinator.config.json

  # This job gates PR merges; add any new jobs to 'needs' below.
  # Jobs in 'allowed_failures' may fail without blocking the workflow.
  #
  # This is a workaround for GitHub requiring listing all required jobs... (see https://github.com/orgs/community/discussions/12395)
  ci-workflow-status:
    name: Check Workflow Status
    runs-on: ubuntu-latest
    needs:
      [
        lint-crates,
        audit-crates,
        check-crates,
        test-crates,
        check-node-native-integration,
        check-node-wrapper,
        check-browser-wrapper,
        check-csharp-integration,
        check-python-integration,
        check-php-integration,
        build-csharp,
        build-browser-wasm,
        build-node-native,
        build-tools,
        build-python-native,
        build-php-native,
        build-java-native,
        e2e-test-node-integration,
        e2e-test-browser-integration,
        e2e-test-csharp-integration,
        e2e-test-python-integration,
        e2e-test-php-integration,
        e2e-test-java-integration,
        e2e-test-cli,
        typst-integration,
        spelling,
        validate-links,
      ]
    if: always()
    steps:
      - name: Check Workflow Status
        run: |
          allowed_failures="validate-links audit-crates"
          failed=""
          cancelled=""
          names='${{ toJson(needs) }}'
          while IFS= read -r job; do
            result=$(echo "$names" | jq -r --arg job "$job" '.[$job].result')
            if echo "$allowed_failures" | grep -qw "$job"; then
              if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
                echo "Allowed failure: $job ($result)"
              fi
              continue
            fi
            if [[ "$result" == "failure" ]]; then
              failed="$failed\n  - $job"
            elif [[ "$result" == "cancelled" ]]; then
              cancelled="$cancelled\n  - $job"
            fi
          done < <(echo "$names" | jq -r 'keys[]')
          if [[ -n "$failed" || -n "$cancelled" ]]; then
            if [[ -n "$failed" ]]; then
              echo -e "Failed jobs:$failed"
            fi
            if [[ -n "$cancelled" ]]; then
              echo -e "Cancelled jobs:$cancelled"
            fi
            exit 1
          fi
