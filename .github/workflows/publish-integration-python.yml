name: Publish Python Integration

on:
  workflow_dispatch:
    inputs:
      publish-native:
        description: 'Publish native package'
        type: boolean
        default: true
      publish-wrapper:
        description: 'Publish oicana wrapper package'
        type: boolean
        default: true
  push:
    tags:
      - 'oicana_python-v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-publish-native:
    if: ${{ github.event_name == 'push' || inputs.publish-native }}
    name: Build oicana-native (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            manylinux: auto
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
          - runner: macos-26
            target: x86_64-apple-darwin
            manylinux: auto
          - runner: macos-26
            target: aarch64-apple-darwin
            manylinux: auto
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: auto
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.platform.target }}
          command: build
          args: --release --out dist --find-interpreter
          working-directory: integrations/python/oicana-python-native
          manylinux: ${{ matrix.platform.manylinux }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.target }}
          path: integrations/python/oicana-python-native/dist/*.whl
          if-no-files-found: error

  publish-native-to-pypi:
    if: ${{ github.event_name == 'push' || inputs.publish-native }}
    name: Publish oicana-native to PyPI
    runs-on: ubuntu-24.04
    needs: build-and-publish-native
    environment:
      name: pypi
      url: https://pypi.org/p/oicana-native
    steps:
      - uses: actions/checkout@v6
      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: List distributions
        run: ls -lh dist/
      - name: Publish to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: upload
          args: --skip-existing dist/*

  publish-wrapper-to-pypi:
    if: ${{ (github.event_name == 'push' || inputs.publish-wrapper) && (success() || needs.publish-native-to-pypi.result == 'skipped') }}
    name: Publish oicana wrapper to PyPI
    runs-on: ubuntu-24.04
    needs: publish-native-to-pypi
    environment:
      name: pypi
      url: https://pypi.org/p/oicana
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Build wrapper package
        run: uv build
        working-directory: integrations/python/oicana-python
      - name: List distributions
        run: ls -lh dist/
        working-directory: integrations/python
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: integrations/python/dist/
          skip-existing: true
