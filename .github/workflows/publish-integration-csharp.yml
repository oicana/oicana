name: publish csharp

# This workflow builds and publishes the C# integration
#
# Publishing uses NuGet trusted publishing (OIDC). It requires the secret NUGET_USER with the
# nuget.org account name.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0-rc.1)'
        type: string
        required: true
  push:
    tags:
      - 'oicana_csharp-v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

env:
  LIB_NAME: oicana_csharp

jobs:
  validate-version:
    name: Validate version consistency
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v6

      - name: Determine and validate version
        id: version
        run: |
          if [[ "${{ github.ref_name }}" == oicana_csharp-v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#oicana_csharp-v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            echo "::error::Version must be provided via tag or workflow input"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Publishing version: ${VERSION}"

          ERRORS=()

          CARGO_VERSION=$(grep '^version = ' integrations/csharp/oicana_csharp/Cargo.toml | head -n1 | sed 's/version = "\(.*\)"/\1/')
          if [[ "$CARGO_VERSION" != "$VERSION" ]]; then
            ERRORS+=("oicana_csharp/Cargo.toml has version $CARGO_VERSION")
          fi

          PROPS_VERSION=$(grep -oP '(?<=<Version>)[^<]+' integrations/csharp/Directory.Build.props | head -n1)
          if [[ "$PROPS_VERSION" != "$VERSION" ]]; then
            ERRORS+=("Directory.Build.props has version $PROPS_VERSION")
          fi

          if [[ ${#ERRORS[@]} -gt 0 ]]; then
            echo "::error::Version mismatch for ${VERSION}:"
            for err in "${ERRORS[@]}"; do
              echo "::error::  - $err"
            done
            exit 1
          fi

          echo "All version sources match: ${VERSION}"

  build:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-24.04, container: 'quay.io/pypa/manylinux_2_28_x86_64:2026.09.14-1', lib: liboicana_csharp.so }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, container: 'quay.io/pypa/manylinux_2_28_aarch64:2026.09.14-1', lib: liboicana_csharp.so }
          - { rid: linux-musl-x64, os: ubuntu-24.04, target: x86_64-unknown-linux-musl, zig: true, lib: liboicana_csharp.so }
          - { rid: linux-musl-arm64, os: ubuntu-24.04, target: aarch64-unknown-linux-musl, zig: true, lib: liboicana_csharp.so }
          - { rid: osx-x64, os: macos-26, target: x86_64-apple-darwin, lib: liboicana_csharp.dylib }
          - { rid: osx-arm64, os: macos-26, target: aarch64-apple-darwin, lib: liboicana_csharp.dylib }
          - { rid: win-x64, os: windows-2025, lib: oicana_csharp.dll }
          - { rid: win-arm64, os: windows-2025, target: aarch64-pc-windows-msvc, lib: oicana_csharp.dll }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: matrix.zig
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        if: matrix.zig
        with:
          tool: cargo-zigbuild
      - name: Build release
        run: |
          if [[ -n "${{ matrix.zig }}" ]]; then
            RUSTFLAGS="-C target-feature=-crt-static" cargo zigbuild --release -p ${{ env.LIB_NAME }} --target ${{ matrix.target }}
          elif [[ -n "${{ matrix.target }}" ]]; then
            cargo build --release -p ${{ env.LIB_NAME }} --target ${{ matrix.target }}
          else
            cargo build --release -p ${{ env.LIB_NAME }}
          fi
          mkdir dist
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" dist/
      - uses: actions/upload-artifact@v7
        with:
          name: oicana-csharp-${{ matrix.rid }}
          path: dist/${{ matrix.lib }}
          if-no-files-found: error
  check-glibc:
    name: Assert the glibc floor of the Linux libraries
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: oicana-csharp-linux-x64
          path: linux-x64
      - uses: actions/download-artifact@v8
        with:
          name: oicana-csharp-linux-arm64
          path: linux-arm64
      - name: Assert glibc floor
        run: |
          ./.github/scripts/assert-glibc-floor.sh 2.28 \
            linux-x64/lib${{ env.LIB_NAME }}.so \
            linux-arm64/lib${{ env.LIB_NAME }}.so

  package-nuget:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    needs: [validate-version, build, check-glibc]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: oicana-csharp-*
          path: natives
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8'
      - name: Pack Oicana.Core, Oicana.Native.<rid> and Oicana
        run: |
          dotnet pack integrations/csharp/Oicana.Core --configuration Release --output nupkgs
          for dir in natives/oicana-csharp-*; do
            rid="${dir#natives/oicana-csharp-}"
            mkdir -p "integrations/csharp/Oicana.Native/runtimes/$rid/native"
            cp "$dir"/* "integrations/csharp/Oicana.Native/runtimes/$rid/native/"
            dotnet pack integrations/csharp/Oicana.Native --configuration Release --output nupkgs -p:Rid="$rid"
          done
          dotnet pack integrations/csharp/Oicana --configuration Release --output nupkgs \
            -p:RestoreAdditionalProjectSources="$PWD/nupkgs"
      - name: Report package sizes
        run: |
          echo "| Package | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for package in nupkgs/*.nupkg; do
            echo "| $(basename "$package") | $(du -h "$package" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: oicana-csharp-nuget
          path: nupkgs/*.nupkg
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: push packages to nuget.org
        run: |
          dotnet nuget push "nupkgs/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --skip-duplicate
