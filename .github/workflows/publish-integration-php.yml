name: Publish PHP Integration

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0-rc.1)'
        type: string
        required: true
      publish-native:
        description: 'Publish native binaries'
        type: boolean
        default: true
  push:
    tags:
      - 'oicana_php-v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

env:
  LIB_NAME: oicana_php_native

jobs:
  validate-version:
    name: Validate version consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Determine and validate version
        id: version
        run: |
          # Get version from tag or input
          if [[ "${{ github.ref_name }}" == oicana_php-v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#oicana_php-v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Publishing version: ${VERSION}"

          # Validate against all version sources
          ERRORS=()

          CARGO_VERSION=$(grep '^version = ' integrations/php/oicana-php-native/Cargo.toml | head -n1 | sed 's/version = "\(.*\)"/\1/')
          if [[ "$CARGO_VERSION" != "$VERSION" ]]; then
            ERRORS+=("Cargo.toml (oicana-php-native) has version $CARGO_VERSION")
          fi

          WRAPPER_VERSION=$(php -r "echo json_decode(file_get_contents('integrations/php/oicana-php/composer.json'))->version;")
          if [[ "$WRAPPER_VERSION" != "$VERSION" ]]; then
            ERRORS+=("oicana-php/composer.json has version $WRAPPER_VERSION")
          fi

          INSTALLER_VERSION=$(php -r "echo json_decode(file_get_contents('integrations/php/oicana-php-installer/composer.json'))->version;")
          if [[ "$INSTALLER_VERSION" != "$VERSION" ]]; then
            ERRORS+=("oicana-php-installer/composer.json has version $INSTALLER_VERSION")
          fi

          if [[ ${#ERRORS[@]} -gt 0 ]]; then
            echo "::error::Version mismatch for ${VERSION}:"
            for err in "${ERRORS[@]}"; do
              echo "::error::  - $err"
            done
            exit 1
          fi

          echo "All version sources match: ${VERSION}"

  build-matrix:
    needs: validate-version
    if: ${{ github.event_name == 'push' || inputs.publish-native }}
    name: Build ${{ matrix.platform.os }}-${{ matrix.platform.arch }}-php${{ matrix.php }}-${{ matrix.ts }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: linux
            arch: x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust: stable
            lib: liboicana_php_native.so
            flags: "-C link-arg=-Wl,-undefined,dynamic_lookup"
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rust: stable
            lib: liboicana_php_native.so
            flags: "-C link-arg=-Wl,-undefined,dynamic_lookup"
          - os: macos
            arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            rust: stable
            lib: liboicana_php_native.dylib
            flags: "-C link-arg=-Wl,-undefined,dynamic_lookup"
          - os: macos
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            rust: stable
            lib: liboicana_php_native.dylib
            flags: "-C link-arg=-Wl,-undefined,dynamic_lookup"
          - os: windows
            arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            rust: nightly
            lib: oicana_php_native.dll
            flags: ""
        php:
          - '8.3'
          - '8.4'
          - '8.5'
        ts:
          - nts
          - zts

    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.platform.rust }}
          targets: ${{ matrix.platform.target }}
          components: rustfmt
      - run: rustup show
      - name: Remove preinstalled macOS PHP so setup-php installs the requested build
        # macOS runners preinstall NTS PHP (Homebrew `php`/`php@X.Y`). setup-php
        # detects an existing PHP via the Homebrew Cellar keg, and when the
        # requested version matches it "switches to it" and ignores `phpts` (even
        # with `update: true`, since the preinstalled is already the latest
        # patch), so ZTS cells silently get NTS.
        if: matrix.platform.os == 'macos'
        run: |
          for f in $(brew list --formula 2>/dev/null | grep -E '^php($|@)'); do
            echo "Uninstalling preinstalled $f"
            brew uninstall --ignore-dependencies --force "$f" || true
          done
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
        env:
          phpts: ${{ matrix.ts }}
          update: true
      - run: php -v
      - name: Verify active PHP matches the matrix cell
        shell: bash
        run: |
          echo "php binary: $(command -v php)"
          ver="$(php -v)"
          echo "${ver}" | head -n1
          case "${ver}" in *ZTS*) ACTUAL=zts ;; *) ACTUAL=nts ;; esac
          echo "active PHP thread safety: ${ACTUAL} (matrix ts=${{ matrix.ts }})"
          if [ "${ACTUAL}" != "${{ matrix.ts }}" ]; then
            echo "::error::matrix wants ${{ matrix.ts }} PHP but the active PHP is ${ACTUAL}"
            exit 1
          fi
      - name: Compute PHP ABI for the cache key
        id: php_abi
        shell: bash
        run: |
          abi="$(php -i | sed -n 's/^PHP Extension Build => //p' | tr -d ' ' | tr ',' '-')"
          echo "abi=${abi}" >> "$GITHUB_OUTPUT"
          echo "PHP ABI: ${abi}"
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ matrix.platform.target }}-cargo-php-${{ steps.php_abi.outputs.abi }}-${{ hashFiles('**/Cargo.lock', 'integrations/php/**/*.rs') }}
          restore-keys: |
            ${{ matrix.platform.target }}-cargo-php-${{ steps.php_abi.outputs.abi }}-
      - name: Pin MSVC toolset to the PHP core's linker version
        if: matrix.platform.os == 'windows'
        shell: pwsh
        run: ./.github/scripts/pin-msvc-for-php.ps1
      - name: Build PHP extension
        run: cargo build --release --target ${{ matrix.platform.target }} -p oicana_php_native
        env:
          RUSTFLAGS: ${{ matrix.platform.flags }}
      - name: Verify PHP extension loads
        run: |
          php -d extension=./target/${{ matrix.platform.target }}/release/${{ matrix.platform.lib }} -r "print_r(array_filter(get_defined_functions()['internal'], fn(\$f) => str_contains(\$f, 'oicana') || str_contains(\$f, 'register') || str_contains(\$f, 'compile')));"
          php -d extension=./target/${{ matrix.platform.target }}/release/${{ matrix.platform.lib }} -r "exit(function_exists('OicanaInternal\\manifest') ? 0 : 1);"
        shell: bash
      - name: Rename binary to match installer convention
        run: |
          EXT=${{ matrix.platform.os == 'windows' && 'dll' || (matrix.platform.os == 'macos' && 'dylib' || 'so') }}
          cp ./target/${{ matrix.platform.target }}/release/${{ matrix.platform.lib }} \
             ./oicana-php${{ matrix.php }}-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ matrix.ts }}.${EXT}
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-php${{ matrix.php }}-${{ matrix.ts }}
          path: ./oicana-php${{ matrix.php }}-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ matrix.ts }}.*
          if-no-files-found: error

  create-release:
    if: ${{ github.event_name == 'push' || inputs.publish-native }}
    name: Create GitHub Release
    needs: [validate-version, build-matrix]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: binaries
          pattern: binary-*
          merge-multiple: true

      - name: List binaries
        run: ls -lh binaries/

      - name: Generate checksums.json
        working-directory: binaries
        run: |
          python3 - <<'PY' > checksums.json
          import hashlib, json, os, sys
          binaries = {}
          for f in sorted(os.listdir('.')):
              if f == 'checksums.json' or not os.path.isfile(f):
                  continue
              with open(f, 'rb') as fh:
                  h = hashlib.sha256(fh.read()).hexdigest()
              binaries[f] = f"sha256:{h}"
          json.dump({"binaries": binaries}, sys.stdout, indent=2, sort_keys=True)
          print()
          PY
          cat checksums.json

      - name: Check if release exists
        id: check_release
        run: |
          if gh release view "oicana_php-v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
            echo "Release oicana_php-v${{ env.VERSION }} already exists"
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
            echo "Release oicana_php-v${{ env.VERSION }} does not exist"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        if: steps.check_release.outputs.EXISTS == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: oicana_php-v${{ env.VERSION }}
          name: PHP Integration v${{ env.VERSION }}
          body: |
            ## Oicana PHP Integration v${{ env.VERSION }}

            This release includes native binaries for:
            - **PHP versions**: 8.3, 8.4, 8.5
            - **Thread safety**: NTS (non-thread-safe), ZTS (thread-safe)
            - **Platforms**: Linux (x64, ARM64), macOS (x64, ARM64), Windows (x64)

            ### Installation

            ```bash
            composer require oicana/oicana
            ```

            The installer will automatically download the appropriate binary for your platform.

            ### Manual Installation

            If automatic installation fails, download the binary for your platform from the assets below and add it to your `php.ini`:

            ```ini
            extension=/path/to/oicana-php8.3-linux-x64-nts.so
            ```

            ### Binary Naming Convention

            Format: `oicana-php{VERSION}-{OS}-{ARCH}-{TS}.{EXT}`

            Example: `oicana-php8.3-linux-x64-nts.so`

            ### Documentation

            - [GitHub Repository](https://github.com/oicana/oicana)
            - [Documentation](https://oicana.com/docs)
            - [Oicana Website](https://oicana.com)
          files: binaries/*
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binaries to existing release
        if: steps.check_release.outputs.EXISTS == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: oicana_php-v${{ env.VERSION }}
          files: binaries/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-composer-registry:
    name: Update Composer Registry
    needs: create-release
    if: ${{ always() && needs.create-release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Satis repository rebuild
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.COMPOSER_REPO_TOKEN }}" \
            https://api.github.com/repos/oicana/composer/dispatches \
            -d '{"event_type":"php-release"}'
