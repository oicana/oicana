# This is an updated workflow from the one generated by NAPI 

name: publish node integration
env:
  DEBUG: napi:*
  APP_NAME: node-native
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  CARGO_INCREMENTAL: '1'
  PROJECT_DIR: "integrations/node/oicana-node-native"

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'oicana_node-v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: ${{ env.PROJECT_DIR }}/yarn.lock
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install dependencies
        run: yarn install
        working-directory: ${{ env.PROJECT_DIR }}
      - name: Oxlint
        run: yarn lint
        working-directory: ${{ env.PROJECT_DIR }}
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: yarn build --target x86_64-apple-darwin
          - host: windows-latest
            build: yarn build --target x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: yarn build --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: macos-latest
            target: aarch64-apple-darwin
            build: yarn build --target aarch64-apple-darwin
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: yarn build --target aarch64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: yarn build --target x86_64-unknown-linux-musl -x
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: yarn build --target aarch64-unknown-linux-musl -x
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: yarn build --target aarch64-pc-windows-msvc
    name: stable - ${{ matrix.settings.target }} - node@24
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: ${{ env.PROJECT_DIR }}/yarn.lock
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}
      - uses: mlugg/setup-zig@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - name: Setup toolchain
        run: ${{ matrix.settings.setup }}
        if: ${{ matrix.settings.setup }}
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
      - name: Install dependencies
        run: yarn install
        working-directory: ${{ env.PROJECT_DIR }}
      - name: Build
        run: ${{ matrix.settings.build }}
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            integrations/node/oicana-node-native/${{ env.APP_NAME }}.*.node
            integrations/node/oicana-node-native/${{ env.APP_NAME }}.*.wasm
          if-no-files-found: error
  test-macOS-windows-binding:
    name: Test bindings on ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64
          - host: windows-11-arm
            target: aarch64-pc-windows-msvc
            architecture: arm64
          - host: macos-latest
            target: aarch64-apple-darwin
            architecture: arm64
          - host: macos-latest
            target: x86_64-apple-darwin
            architecture: x64
        node:
          - '20'
          - '22'
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
          architecture: ${{ matrix.settings.architecture }}
          cache-dependency-path: ${{ env.PROJECT_DIR }}/yarn.lock
      - name: Install dependencies
        run: yarn install
        working-directory: ${{ env.PROJECT_DIR }}
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ${{ env.PROJECT_DIR }}
      - name: List packages
        run: ls -R .
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
      - name: Test bindings
        run: yarn test
        working-directory: ${{ env.PROJECT_DIR }}
  test-linux-binding:
    name: Test ${{ matrix.target }} - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
        node:
          - '20'
          - '22'
    runs-on: ${{ contains(matrix.target, 'aarch64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
          cache-dependency-path: ${{ env.PROJECT_DIR }}/yarn.lock
      - name: Output docker params
        id: docker
        run: |
          node -e "
            if ('${{ matrix.target }}'.startsWith('aarch64')) {
              console.log('PLATFORM=linux/arm64')
            } else if ('${{ matrix.target }}'.startsWith('armv7')) {
              console.log('PLATFORM=linux/arm/v7')
            } else {
              console.log('PLATFORM=linux/amd64')
            }
          " >> $GITHUB_OUTPUT
          node -e "
            if ('${{ matrix.target }}'.endsWith('-musl')) {
              console.log('IMAGE=node:${{ matrix.node }}-alpine')
            } else {
              console.log('IMAGE=node:${{ matrix.node }}-slim')
            }
          " >> $GITHUB_OUTPUT
        working-directory: ${{ env.PROJECT_DIR }}
      - name: Install dependencies
        run: |
          yarn config set --json supportedArchitectures.cpu '["current", "arm64", "x64", "arm"]'
          yarn config set --json supportedArchitectures.libc '["current", "musl", "gnu"]'
          yarn install
        working-directory: ${{ env.PROJECT_DIR }}
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.target }}
          path: ${{ env.PROJECT_DIR }}
      - name: List packages
        run: ls -R .
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        if: ${{ contains(matrix.target, 'armv7') }}
        with:
          platforms: all
          working-directory: ${{ env.PROJECT_DIR }}
      - run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
        if: ${{ contains(matrix.target, 'armv7') }}
        working-directory: ${{ env.PROJECT_DIR }}
      - name: Test bindings
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ steps.docker.outputs.IMAGE }}
          options: '-v ${{ github.workspace }}:${{ github.workspace }} -w ${{ github.workspace }} --platform ${{ steps.docker.outputs.PLATFORM }}'
          run: cd ${{ env.PROJECT_DIR }} && yarn test
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    needs:
      - lint
      - test-macOS-windows-binding
      - test-linux-binding
    steps:
      - uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: ${{ env.PROJECT_DIR }}/yarn.lock
      - name: Install dependencies
        run: yarn install
        working-directory: ${{ env.PROJECT_DIR }}
      - name: create npm dirs
        run: yarn napi create-npm-dirs
        working-directory: ${{ env.PROJECT_DIR }}
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ env.PROJECT_DIR }}/artifacts
      - name: Move artifacts
        run: yarn artifacts
        working-directory: ${{ env.PROJECT_DIR }}
      - name: List packages
        run: ls -R ./npm
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
      - name: Publish
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "Checking if $name@$version already exists:"
          if npm view "$name@$version" > /dev/null 2>&1; then
            echo "Version $version already exists on npmjs. Not publishing."
            exit 0
          fi
          echo "Version $version not found on npmjs. Proceeding to publish..."

          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "No OIDC token available, the job is missing 'permissions: id-token: write'."
            exit 1
          fi

          # even a dry-run below will still trigger a publish of the optional dependencies through the 'prepublishOnly' script!
          if echo "$version" | grep -Eq "^[0-9]+\.[0-9]+\.[0-9]+$";
          then
            npm publish --access public
          elif echo "$version" | grep -Eq "^[0-9]+\.[0-9]+\.[0-9]+";
          then
            npm publish --access public --tag next
          fi
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-publish-wrapper:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs:
      - publish
    env:
      LIB_NAME: node
      SCOPE: oicana
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Wait for the native package
        # a freshly published version takes a few minutes to become installable
        run: |
          version=$(jq -r '.dependencies["@oicana/node-native"]' package.json)
          for attempt in $(seq 1 60); do
            if npm view "@oicana/node-native@$version" version --prefer-online > /dev/null 2>&1; then
              echo "@oicana/node-native@$version is available"
              exit 0
            fi
            echo "Attempt $attempt: @oicana/node-native@$version is not on npmjs yet, waiting"
            sleep 30
          done
          echo "@oicana/node-native@$version did not become available within 30 minutes"
          exit 1
        working-directory: integrations/node/oicana-node
      - name: Install dependencies
        run: npm i
        working-directory: integrations/node/oicana-node
      - name: Build
        run: npm run build
        working-directory: integrations/node/oicana-node
      - name: Pack
        run: npm pack
        working-directory: integrations/node/oicana-node
      - name: version
        id: version
        run: echo "version=$(jq -r '.version' package.json)" >> $GITHUB_OUTPUT
        working-directory: integrations/node/oicana-node
      - uses: actions/upload-artifact@v7
        with:
          name: "oicana-node-${{ steps.version.outputs.version }}.tgz"
          path: integrations/node/oicana-node/${{ env.SCOPE }}-${{ env.LIB_NAME }}-*.tgz
      - name: Publish
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          
          echo "Checking if $name@$version already exists:"
          if npm view "$name@$version" > /dev/null 2>&1; then
            echo "Version $version already exists on npmjs. Not publishing."
            exit 0
          fi
          echo "Version $version not found on npmjs. Proceeding to publish..."

          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "No OIDC token available, the job is missing 'permissions: id-token: write'."
            exit 1
          fi

          if echo "$version" | grep -Eq "^[0-9]+\.[0-9]+\.[0-9]+$";
          then
            npm publish --access public
          elif echo "$version" | grep -Eq "^[0-9]+\.[0-9]+\.[0-9]+";
          then
            npm publish --access public --tag next
          fi
        working-directory: integrations/node/oicana-node
